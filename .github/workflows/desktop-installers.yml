# Builds the family PC app (familystream-desktop, a modified Nuvio Desktop) into Windows and Mac
# installers and adds them to a family release. Started by familystream-desktop's
# scripts/family-release.sh. The source is private: it's checked out with a read-only deploy key
# (secret DESKTOP_DEPLOY_KEY); its GPL source archive is attached to the release by that script.
name: PC installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Family release to add the installers to (year.month.n)
        required: true
      ref:
        description: Tag or branch of familystream-desktop to build (pc-<version>)
        required: true

permissions:
  contents: write

concurrency:
  group: pc-installers-${{ inputs.version }}
  cancel-in-progress: false

env:
  FAMILY_VERSION: ${{ inputs.version }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - name: Check out the family PC app
        uses: actions/checkout@v4
        with:
          repository: jozrcr/familystream-desktop
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.DESKTOP_DEPLOY_KEY }}
          lfs: false

      - name: Versions
        shell: bash
        run: scripts/ci-versions.sh >> "$GITHUB_ENV"

      - name: Fetch the Windows mpv runtime (Git LFS, from upstream Nuvio Desktop)
        shell: bash
        run: |
          git config lfs.url https://github.com/NuvioMedia/NuvioDesktop.git/info/lfs
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          size="$(wc -c < composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll)"
          (( size > 1000000 )) || { echo "libmpv-2.dll was not fetched from Git LFS" >&2; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Local properties
        shell: bash
        run: echo "sdk.dir=$(cygpath -m "$ANDROID_HOME")" > local.properties

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pnuvio.desktop.versionName=$env:FAMILY_VERSION" `
            "-Pnuvio.desktop.versionCode=$env:FAMILY_VERSION_CODE" `
            "-Pnuvio.desktop.packageVersion=$env:FAMILY_PACKAGE_VERSION" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi="$(ls composeApp/build/compose/release-msis/*.msi | head -1)"
          [[ -f "$msi" ]] || { echo "No MSI was produced" >&2; exit 1; }
          cp "$msi" familystream-pc-windows-x64.msi
          gh release upload "$FAMILY_VERSION" familystream-pc-windows-x64.msi --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out the family PC app
        uses: actions/checkout@v4
        with:
          repository: jozrcr/familystream-desktop
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.DESKTOP_DEPLOY_KEY }}
          lfs: false

      - name: Versions
        run: scripts/ci-versions.sh >> "$GITHUB_ENV"

      - name: Fetch the macOS mpv runtime (Git LFS, from upstream Nuvio Desktop)
        run: |
          git config lfs.url https://github.com/NuvioMedia/NuvioDesktop.git/info/lfs
          git lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/${{ matrix.arch }}/**" --exclude=""

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Local properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build DMG (unsigned)
        env:
          NUVIO_MACOS_SIGNING_IDENTITY: ''
          NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE: ''
        run: |
          ./gradlew :composeApp:packageReleaseDmg \
            "-Pnuvio.macos.arch=${{ matrix.arch }}" \
            "-Pnuvio.desktop.versionName=$FAMILY_VERSION" \
            "-Pnuvio.desktop.versionCode=$FAMILY_VERSION_CODE" \
            "-Pnuvio.desktop.packageVersion=$FAMILY_PACKAGE_VERSION" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache --no-daemon --stacktrace

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="$(ls composeApp/build/compose/release-dmgs/*.dmg | head -1)"
          [[ -f "$dmg" ]] || { echo "No DMG was produced" >&2; exit 1; }
          cp "$dmg" "familystream-pc-macos-${{ matrix.arch }}.dmg"
          gh release upload "$FAMILY_VERSION" "familystream-pc-macos-${{ matrix.arch }}.dmg" --clobber --repo "$GITHUB_REPOSITORY"
